name: Finalize submission repository

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize verification files with final manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('verify.py')
          text = p.read_text(encoding='utf-8')

          # Replace only the explanatory module docstring wholesale.  The
          # mathematical implementation below it is left unchanged apart from
          # manuscript labels/comments in the targeted replacements that follow.
          head, tail = text.split('"""', 1)
          _old_doc, body = tail.split('"""', 1)
          new_doc = r'''
          Machine verification for

              "Asymptotically Optimal Online Selection of a Large Voronoi Cell", A. Sadhu.

          Requires : sympy, mpmath, numpy, scipy
          Run      : python -u verify.py --no-pause
          Threads  : half the logical cores; override with VERIFY_PROCS=n.

          ------------------------------------------------------------------------------
          WHAT IS PROVED HERE, AND WHAT IS ONLY TESTED
          ------------------------------------------------------------------------------
          PROOF-GRADE. Exact rational/algebraic arithmetic, or verified mpmath interval
          arithmetic. No floating-point approximation is used in a proof-critical
          comparison.

            Thms 5.5 / 5.6 / 5.7  all eleven square-cell inequalities, exactly in sympy
            Cor. 5.3               f(1/2,1/2) = 4 sqrt(2)/3 - 5/3, exactly
            Prop. 5.9              f(q) and grad f(q) enclosed at all 64 probes; outward
                                   rational rounding; exact polygon intersection/order/area
            Remark 5.8             the fundamental-domain area identity, exactly
            Lemma 6.4              the extremal one-hit half-ball case, exactly
            Thm. 6.6               the two-cone expansion in (6.5), exactly
            Lemma 7.10 / Prop. 7.11
                                   the area-transfer and architecture-bound arithmetic
            Section 7              the polar-density normalization, neighbour-separation
                                   arithmetic, satellite containment estimate, and gap
                                   polynomial used in the hidden-tile construction

          CONSISTENCY TESTS. Numerical ray shooting, Monte Carlo, or simulation. These
          are evidence/cross-checks, not proofs.

            Lemma 5.4              closed form for f cross-checked against the raw
                                   definition of D_p by numerical ray shooting
            Lemma 5.1              concavity of f^(1/2) on random segments
            Lemmas 3.1 / 3.2       flower inequality and empty-flower property
            Remark 5.10            the two numerical constants
            Lemma 6.1              the scaling of E[Y]
            Lemma 6.4              illustrative segment/slab fractions beyond the exact
                                   extremal half-ball check
            Thm. 7.4               equal-area gadget built at r = 21, 41, 81 and measured
            Prop. 3.5 / Thm. 4.2   simulated torus point sets

          NOT MACHINE-CHECKED. The probabilistic arguments themselves: the conditioning
          in the lower bound of Theorem 6.5, the generalized isolation tradeoff of
          Theorem 4.2, and the geometric/posterior proof of Theorem 7.4. Those are hand
          proofs. "ALL CHECKS PASSED" does not claim otherwise.
          '''.strip('\n') + '\n'
          text = head + '"""\n' + new_doc + '"""' + body

          replacements = [
              ('# ==================== Proposition 4.9, verified intervals ====================',
               '# ==================== Proposition 5.9, verified intervals ===================='),
              ('# ==================== torus simulation (Prop 2.5, Thm 3.2) ===================',
               '# ==================== torus simulation (Prop 3.5, Thm 4.2) ==================='),
              ('Periodic Voronoi areas for the fence-free Section 6 construction.',
               'Periodic Voronoi areas for the fence-free Section 7 construction.'),
              ('1. Lemma 4.4   exact formula vs. the raw definition of D_p',
               '1. Lemma 5.4   exact formula vs. the raw definition of D_p'),
              ('formula (4.1) reproduces the raw definition at 13 points',
               'formula (5.1) reproduces the raw definition at 13 points'),
              ('2. Theorem 4.5   P[f >= 9/50] >= 9/50   [exact]',
               '2. Theorem 5.5   P[f >= 9/50] >= 9/50   [exact]'),
              ('3. Theorem 4.6   P[f >= 193/1000] >= 193/1000   [exact]',
               '3. Theorem 5.6   P[f >= 193/1000] >= 193/1000   [exact]'),
              ('4. Theorem 4.7   P[f >= 1/6] >= 917/2500   [exact]',
               '4. Theorem 5.7   P[f >= 1/6] >= 917/2500   [exact]'),
              ('5. Corollary 4.3   the centre maximizes f',
               '5. Corollary 5.3   the centre maximizes f'),
              ('6. Lemma 4.1   concavity of f^(1/2)   [Monte Carlo]',
               '6. Lemma 5.1   concavity of f^(1/2)   [Monte Carlo]'),
              ('7. Remark 4.10   the two numerical constants   [numerical]',
               '7. Remark 5.10   the two numerical constants   [numerical]'),
              ('8. Lemma 5.1   E[Y] scaling', '8. Lemma 6.1   E[Y] scaling'),
              ('9. Lemma 5.4   one hit vs two   [illustration, not proof]',
               '9. Lemma 6.4   one hit vs two   [illustration, not proof]'),
              ('Lemma 5.4  a bisector through the centre leaves exactly 1/2',
               'Lemma 6.4  a bisector through the centre leaves exactly 1/2'),
              ('10. Proposition 4.9   VERIFIED INTERVAL ARITHMETIC (f and grad f)',
               '10. Proposition 5.9   VERIFIED INTERVAL ARITHMETIC (f and grad f)'),
              ('11. Remark 4.8   area = 8 x (area in the fundamental triangle)',
               '11. Remark 5.8   area = 8 x (area in the fundamental triangle)'),
              ('12. Lemmas 2.1 and 2.2   flower inequality and empty flower',
               '12. Lemmas 3.1 and 3.2   flower inequality and empty flower'),
              ('13. Theorem 5.6 and Section 6 obstructions   [closed forms]',
               '13. Theorem 6.6 and Section 7 obstructions   [closed forms]'),
              ('# (5.5) the two-cone probability, expanded exactly.',
               '# (6.5) the two-cone probability, expanded exactly.'),
              ('(5.5)  1 - 2(1-a)^s + (1-2a)^s has a^2 coefficient s(s-1)',
               '(6.5)  1 - 2(1-a)^s + (1-2a)^s has a^2 coefficient s(s-1)'),
              ('(5.5)  the a^1 coefficient vanishes, so the pair term leads',
               '(6.5)  the a^1 coefficient vanishes, so the pair term leads'),
              ('# (6.13) the area-transfer counting step.',
               '# (7.13) the area-transfer counting step.'),
              ('(6.13)  v - v/r <= |Q\\P| v/r  implies  |Q\\P| >= r-1',
               '(7.13)  v - v/r <= |Q\\P| v/r  implies  |Q\\P| >= r-1'),
              ("# (6.14) Proposition 6.8's averaging step: an algorithm taking a uniformly",
               "# Proposition 7.11 averaging step: an algorithm taking a uniformly"),
              ('(6.14)  m/(m+(m-1)r) >= 1/(1+r), i.e. the random-arrival payoff',
               'Prop. 7.11  m/(m+(m-1)r) >= 1/(1+r), i.e. the random-arrival payoff'),
              ('# Proposition 6.11 is restricted to the construction of Theorem 6.4.',
               '# Proposition 7.11 is restricted to the construction of Theorem 7.4.'),
              ('(6.14)  (c/r)^r >= 1/m  is  r log(r/c) <= log m   [exact, sympy]',
               '(7.14)  (c/r)^r >= 1/m  is  r log(r/c) <= log m   [exact, sympy]'),
              ('(6.14)  r_max log r_max / log m -> 1, so r_max = (1+o(1))L/log L',
               '(7.14)  r_max log r_max / log m -> 1, so r_max = (1+o(1))L/log L'),
              ('14. Theorem 6.4   the equal-area hidden-tile construction',
               '14. Theorem 7.4   the equal-area hidden-tile construction'),
              ('# ---- proof-grade: the closed-form ingredients of the new Section 6 ----',
               '# ---- proof-grade: the closed-form ingredients of the new Section 7 ----'),
              ('(6.2)  int_0^{2pi} g = 1, i.e. g is a probability density on Q',
               '(7.1)  int_0^{2pi} g = 1, i.e. g is a probability density on Q'),
              ('(6.2)  g(0) = 1/8 and g(pi/4) = 1/4, so 1/8 <= g <= 1/4',
               '(7.1)  g(0) = 1/8 and g(pi/4) = 1/4, so 1/8 <= g <= 1/4'),
              ('(6.6)  axial separation is exactly 8/r   [exact, sympy]',
               '(7.5)  axial separation is exactly 8/r   [exact, sympy]'),
              ('(6.6)  diagonal separation is exactly 16/r   [exact, sympy]',
               '(7.5)  diagonal separation is exactly 16/r   [exact, sympy]'),
              ('(6.6)  perturbation bound 3*sqrt2 <= 6 < 8   [exact, rational]',
               '(7.5)  perturbation bound 3*sqrt2 <= 6 < 8   [exact, rational]'),
              ('(6.7)  satellite cell lies in (1+2/r)Q for r >= 4   [exact, rational]',
               '(7.6)  satellite cell lies in (1+2/r)Q for r >= 4   [exact, rational]'),
              ('(6.9)  r(1-8/r)^2/(1+2/r)^2 >= r - 20 for all r > 0   [exact, sympy]',
               '(7.8)  r(1-8/r)^2/(1+2/r)^2 >= r - 20 for all r > 0   [exact, sympy]'),
              ('The remaining Section 6 checks are numerical: the construction is',
               'The remaining Section 7 checks are numerical: the construction is'),
              ('area(V(z_J)) >= (1-8/r)^2 l^2', 'area(V(z_J)) >= (1-8/r)^2 l^2'),
              ('the explicit inner-square certificate in (6.6).',
               'the explicit inner-square certificate in (7.5).'),
              ('max deficit {max(deficits):.3f} < 20 from (6.9)',
               'max deficit {max(deficits):.3f} < 20 from (7.8)'),
              ('15. Prop 2.5 / Thm 3.2   torus simulation   [consistency, not proof]',
               '15. Prop 3.5 / Thm 4.2   torus simulation   [consistency, not proof]'),
              ('earlier presentation of Theorem 3.2; the updated theorem allows general a_n,s_n.',
               'earlier presentation of Theorem 4.2; the updated theorem allows general a_n,s_n.'),
              ('EXPECTED SECOND ORDER.  Theorem 3.2 says 2^d n A / log n -> 1, and the',
               'EXPECTED SECOND ORDER.  Theorem 4.2 says 2^d n A / log n -> 1, and the'),
          ]

          missing = []
          for old, new in replacements:
              if old not in text:
                  # One no-op entry above documents the unchanged check wording.
                  if old != 'area(V(z_J)) >= (1-8/r)^2 l^2':
                      missing.append(old)
                  continue
              text = text.replace(old, new)

          if missing:
              raise SystemExit('Expected source fragments were not found:\n- ' + '\n- '.join(missing))

          # These are stale labels that must not survive in the final verification source.
          stale = [
              'Lemma 4.4', 'Theorem 4.5', 'Theorem 4.6', 'Theorem 4.7',
              'Corollary 4.3', 'Lemma 4.1', 'Remark 4.10', 'Proposition 4.9',
              'Remark 4.8', 'Lemmas 2.1', 'Prop 2.5', 'Thm 3.2', 'Theorem 3.2',
              'Theorem 6.4', 'Thm 6.4', 'Proposition 6.11', 'Proposition 6.8',
              'formula (4.1)', '(6.13)', '(6.14)', '(6.6)', '(6.7)', '(6.9)',
          ]
          bad = [s for s in stale if s in text]
          if bad:
              raise SystemExit('Stale manuscript labels remain: ' + ', '.join(bad))

          p.write_text(text, encoding='utf-8')

          Path('verify_submission.py').write_text('''#!/usr/bin/env python3\n"""Submission-facing launcher for the final-manuscript verification suite.\n\nAll theorem, lemma, section, and equation labels are stored directly in\nverify.py; this file performs no translation or relabelling.\n"""\nfrom pathlib import Path\nimport runpy\n\nrunpy.run_path(str(Path(__file__).with_name("verify.py")), run_name="__main__")\n''', encoding='utf-8')

          numbering = Path('MANUSCRIPT_NUMBERING.md')
          if numbering.exists():
              numbering.unlink()

          Path('README.md').write_text(r'''# Machine verification for *Asymptotically Optimal Online Selection of a Large Voronoi Cell*

This repository accompanies

> A. Sadhu, *Asymptotically Optimal Online Selection of a Large Voronoi Cell*,

which extends S. Har-Peled, *The Prophet and the Voronoi Diagram*, ESA 2026,
LIPIcs vol. 388, Article 41, DOI 10.4230/LIPIcs.ESA.2026.41.

The repository is synchronized directly with the numbering of the final
submission manuscript. There is no legacy-number translation layer.

`verify.py` contains the computational checks. `verify_submission.py` is the
submission-facing launcher named in the manuscript and simply executes
`verify.py`; it performs no relabelling.

## Running it

```bash
pip install sympy mpmath numpy scipy
python -u verify_submission.py --no-pause
```

Equivalently:

```bash
python -u verify.py --no-pause
```

The suite uses half the logical cores by default; override this with
`VERIFY_PROCS=n`. Output is flushed line by line and the exit status is non-zero
if any check fails.

Current reference run: **65 checks, 0 failures**, about 2.5 minutes on 8
processes.

## What is proved, and what is only tested

### Proof-grade checks

These use exact rational/algebraic arithmetic or verified `mpmath` interval
arithmetic. No floating-point approximation is used in a proof-critical
comparison.

| Manuscript result | What the script certifies |
|---|---|
| Theorems 5.5, 5.6, 5.7 | The eleven square-cell inequalities, exactly in `sympy` |
| Corollary 5.3 | `f(1/2,1/2) = 4*sqrt(2)/3 - 5/3`, exactly |
| Proposition 5.9 | Verified enclosures of `f(q)` and `grad f(q)` at all 64 probes; outward rational rounding; exact polygon intersection, cyclic order, and shoelace area |
| Remark 5.8 | Fundamental-domain area identity, exactly |
| Lemma 6.4 | The extremal one-hit bisector-through-the-centre case leaves exactly one half |
| Theorem 6.6 | The two-cone expansion in (6.5), including the vanishing linear term |
| Lemma 7.10 | The area-transfer counting step in (7.13) |
| Proposition 7.11 | The arithmetic behind (7.14) and the random-arrival averaging bound |
| Section 7 | Polar-density normalization, neighbour-separation arithmetic, satellite containment estimate, and the exact gap polynomial used for (7.5)--(7.8) |

### Consistency tests

These are numerical cross-checks or simulations and are not used as proofs.

- Lemma 5.4: the closed form for `f` is cross-checked against the raw definition
  of `D_p` by numerical ray shooting.
- Lemma 5.1: concavity of `f^(1/2)` on random segments.
- Lemmas 3.1 and 3.2: flower inequality and empty-flower property on sampled
  instances.
- Remark 5.10: the two numerical constants.
- Lemma 6.1: scaling of `E[Y]`.
- Lemma 6.4: illustrative segment/slab fractions beyond the exact extremal check.
- Theorem 7.4: the equal-area construction is built independently for
  `r = 21, 41, 81` and its `r - O(1)` area gap is measured.
- Proposition 3.5 / Theorem 4.2: simulated torus point sets.

For the last row, `2^d n A / log n -> 1` has a correction of order
`log log n / log n`, so at simulable values of `n` the measured value can be near
2 rather than near 1. The script therefore checks the magnitude and trend of the
second-order normalized quantity, not equality.

### Not machine-checked

The probabilistic arguments themselves are hand proofs: in particular the
conditioning in the lower bound of Theorem 6.5, the generalized isolation
tradeoff of Theorem 4.2, and the geometric/posterior proof of Theorem 7.4.
`ALL CHECKS PASSED` does not claim to certify those hand arguments.

## Repository contents

- `verify.py` -- verification suite with final-manuscript numbering.
- `verify_submission.py` -- no-translation submission launcher.
- `LICENSE` -- MIT license.

## License

MIT. See `LICENSE`.
''', encoding='utf-8')
          PY

      - name: Compile-check Python files
        run: python -m py_compile verify.py verify_submission.py

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check sympy mpmath numpy scipy

      - name: Run full verification suite
        env:
          VERIFY_PROCS: '2'
        run: python -u verify_submission.py --no-pause

      - name: Commit finalized repository
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize verification with final manuscript numbering'
          git push origin HEAD:master
